server:
  port: 8085
spring:
  application:
    name: news_service
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
logging:
  level:
    com:
      netflix:
        eureka: off
        discovery: off